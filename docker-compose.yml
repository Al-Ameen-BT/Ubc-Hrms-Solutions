# No secrets in this file. All credentials come from the .env file at the
# project root, which docker compose loads automatically for interpolation.
# Copy .env.example -> .env and fill in real values before running:
#   docker compose up -d
# The :? syntax refuses to start if a required secret is missing from .env.

services:
  app:
    build:
      context: .
      dockerfile: Containerfile
    container_name: ucb-hrms-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_DIALECT=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-ucb_hrms}
      - DB_USER=${DB_USER:-hrms_user}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - JWT_EXPIRY=${JWT_EXPIRY:-12h}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: docker.io/library/mysql:8.0
    container_name: ucb-hrms-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      - MYSQL_DATABASE=${DB_NAME:-ucb_hrms}
      - MYSQL_USER=${DB_USER:-hrms_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
