name: Syntax & Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-syntax-check:
    name: Backend Syntax & Scripts Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Validate JavaScript syntax (Node.js AST check)
        run: |
          echo "Checking JavaScript syntax across backend code..."
          find src -name "*.js" -print0 | xargs -0 -n 1 node --check
          echo "All backend JavaScript files passed syntax verification."

      - name: Validate shell scripts syntax
        run: |
          echo "Checking shell scripts syntax..."
          bash -n deploy.sh deploy/lib/common.sh
          echo "All shell scripts passed syntax check."

  frontend-build-check:
    name: Frontend TypeScript & Vite Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript type check and Vite production build
        working-directory: frontend
        run: npm run build

  container-build-check:
    name: Containerfile Multi-Stage Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build container image with Podman
        run: |
          podman build -t ucb-hrms-backend:ci -f Containerfile .
