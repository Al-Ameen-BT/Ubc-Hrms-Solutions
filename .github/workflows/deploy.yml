name: Production Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  pre-deploy-validation:
    name: Pre-deployment Syntax & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install backend dependencies & check syntax
        run: |
          npm ci
          find src -name "*.js" -print0 | xargs -0 -n 1 node --check
          bash -n deploy.sh deploy/lib/common.sh

      - name: Validate frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy to Production (Podman Quadlets)
    needs: pre-deploy-validation
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute deployment on server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          username: ${{ secrets.SSH_USER || vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || vars.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH || '~/Ubc-Hrms-Solutions' }}"
            echo "Deploying update to ${APP_DIR}..."

            cd "${APP_DIR}"

            # 1. Fetch latest changes
            git fetch origin main
            git reset --hard origin/main

            # 2. Build multi-stage container image and extract static frontend
            ./deploy.sh --stage 4

            # 3. Reload systemd user quadlets and restart backend and frontend/nginx units
            ./deploy.sh --stage 5

            # 4. Run drift verification and health check
            ./deploy.sh --stage 6 || true
            ./deploy.sh --stage 8

            echo "Deployment completed and verified successfully."
